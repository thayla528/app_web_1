<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Frontend</title>
    <!--  Link do bootstrap - Antes do CSS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--  Link do bootstrap icons  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--  Link do CSS  -->
    <link rel="stylesheet" href="/static/style.css"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Purple+Purse&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe:ital@0;1&family=Bangers&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Purple+Purse&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe:ital@0;1&family=Bangers&family=Bitcount+Prop+Double+Ink:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Purple+Purse&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <style>
        :root {
            --bs-primary: #ec5b13;
            --bs-primary-rgb: 236, 91, 19;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #f8f6f6;
        }

        .text-primary {
            color: var(--bs-primary) !important;
        }

        .bg-primary {
            background-color: var(--bs-primary) !important;
        }

        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        .btn-primary:hover {
            background-color: #d45111;
            border-color: #d45111;
        }

        .btn-outline-primary {
            color: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        .btn-outline-primary:hover {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        .card-img-left {
            width: 224px;
            height: 100%;
            object-fit: cover;
            border-radius: 0.75rem 0 0 0.75rem;
        }

        @media (max-width: 768px) {
            .card-img-left {
                width: 100%;
                height: 200px;
                border-radius: 0.75rem 0.75rem 0 0;
            }
        }

        .navbar-brand img {
            width: 32px;
        }

        .material-symbols-outlined {
            vertical-align: middle;
            line-height: 1;
        }

        .badge-soft-primary {
            background-color: rgba(var(--bs-primary-rgb), 0.1);
            color: var(--bs-primary);
        }

        .filter-btn {
            border-radius: 50px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="menu">
    <ul>
        <li><a href="{{ url_for('funcionarios') }}">Funcionários</a></li>
    </ul>
</div>

<div class="conteudo">
    {% block conteudo %}

    {% endblock %}
</div>

<!-- Link do javascript para o bootstrap - Final do body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous" defer></script>
</body>
</html>
